<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile unavailable · Trusted Supplier Program</title><link rel="stylesheet" href="/static/css/brata.css"></head><body>
<div class="auth-wrap">
  <div class="auth-right" style="width:100%"><div class="auth-card">
    <h1>{{ organisation.legal_name }}</h1>
    <div class="callout warn">{{ reason }}</div>
    <p class="muted">If you believe this profile belongs to your company and somebody
    else has claimed it, contact support. A claim can be reversed, and the workspace
    suspended, where the evidence supports it.</p>
    <a class="btn ghost" href="/claim">Back to search</a>
  </div></div>
</div>
</body></html>
